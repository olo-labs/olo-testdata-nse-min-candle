name: Manual versioned NSE minute-data release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.0.0"
        required: true
        type: string

      release_title:
        description: "Optional release title"
        required: false
        default: ""
        type: string

      prerelease:
        description: "Mark this release as a pre-release"
        required: true
        default: false
        type: boolean

      make_latest:
        description: "Mark this release as latest"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: nse-minute-versioned-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_TEMPLATE_RELATIVE: .github/release-notes/version.md
  RELEASE_ASSET_DIRECTORY_RELATIVE: release-assets

  # Approximately 1.90 GiB.
  MAXIMUM_ARCHIVE_BYTES: "2040109465"

  # Conservative initial target based on extracted CSV size.
  TARGET_UNCOMPRESSED_BYTES: "12000000000"

  # Prevent accidental generation of one archive per trading day.
  MAXIMUM_DATA_ARCHIVE_COUNT: "30"

jobs:
  versioned-release:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # ---------------------------------------------------------------
      # Checkout repository and Git LFS content
      # ---------------------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Download Git LFS objects
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git lfs install

          if ($LASTEXITCODE -ne 0) {
              throw "Git LFS initialization failed."
          }

          git lfs pull

          if ($LASTEXITCODE -ne 0) {
              throw "Downloading Git LFS objects failed."
          }

      # ---------------------------------------------------------------
      # Validate semantic version
      # ---------------------------------------------------------------
      - name: Validate release version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:INPUT_VERSION

          if ($null -eq $version) {
              $version = ""
          }

          $version = $version.Trim()

          if (
              $version -notmatch
              '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$'
          ) {
              throw @"
          Invalid release version: $version

          Valid examples:
          - v1.0.0
          - v1.2.3
          - v2.0.0-beta
          - v2.0.0-rc.1
          "@
          }

          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

          Write-Host "Release version: $version"

      # ---------------------------------------------------------------
      # Resolve absolute paths
      # ---------------------------------------------------------------
      - name: Resolve release paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $templatePath = Join-Path `
              $env:GITHUB_WORKSPACE `
              $env:RELEASE_TEMPLATE_RELATIVE

          $assetDirectory = Join-Path `
              $env:GITHUB_WORKSPACE `
              $env:RELEASE_ASSET_DIRECTORY_RELATIVE

          "RELEASE_TEMPLATE=$templatePath" >> $env:GITHUB_ENV
          "RELEASE_ASSET_DIRECTORY=$assetDirectory" >> $env:GITHUB_ENV

          Write-Host "Release template: $templatePath"
          Write-Host "Release asset directory: $assetDirectory"

      # ---------------------------------------------------------------
      # Validate repository source files
      # ---------------------------------------------------------------
      - name: Validate repository release inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $requiredDirectories = @(
              "Minute/NSE",
              "Minute/NSE_IDX"
          )

          foreach ($relativeDirectory in $requiredDirectories) {
              $directory = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  $relativeDirectory

              if (-not (Test-Path $directory -PathType Container)) {
                  throw "Required directory does not exist: $directory"
              }

              $sourceArchives = @(
                  Get-ChildItem `
                      -Path $directory `
                      -Filter "*.zip" `
                      -File
              )

              if ($sourceArchives.Count -eq 0) {
                  throw "No source ZIP files found in: $directory"
              }

              $totalBytes = (
                  $sourceArchives |
                  Measure-Object `
                      -Property Length `
                      -Sum
              ).Sum

              $totalGiB = [Math]::Round(
                  $totalBytes / 1GB,
                  3
              )

              Write-Host "Dataset: $relativeDirectory"
              Write-Host " - Daily ZIP files: $($sourceArchives.Count)"
              Write-Host " - Compressed size: $totalGiB GiB"
          }

          if (-not (Test-Path $env:RELEASE_TEMPLATE -PathType Leaf)) {
              Write-Host "Available files under .github:"

              Get-ChildItem `
                  -Path (
                      Join-Path `
                          $env:GITHUB_WORKSPACE `
                          ".github"
                  ) `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  ForEach-Object {
                      Write-Host " - $($_.FullName)"
                  }

              throw (
                  "Versioned release template does not exist: " +
                  $env:RELEASE_TEMPLATE
              )
          }

          $builderPath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "scripts/Build-ReleaseArchives.ps1"

          if (-not (Test-Path $builderPath -PathType Leaf)) {
              throw "Archive builder does not exist: $builderPath"
          }

      # ---------------------------------------------------------------
      # Build consolidated archives
      # ---------------------------------------------------------------
      - name: Build consolidated release archives
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $builderPath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "scripts/Build-ReleaseArchives.ps1"

          & $builderPath `
              -OutputDirectory $env:RELEASE_ASSET_DIRECTORY_RELATIVE `
              -MaximumArchiveBytes ([long]$env:MAXIMUM_ARCHIVE_BYTES) `
              -TargetUncompressedBytes ([long]$env:TARGET_UNCOMPRESSED_BYTES)

          if ($LASTEXITCODE -ne 0) {
              throw "Building consolidated release archives failed."
          }

          if (
              -not (
                  Test-Path `
                      -Path $env:RELEASE_ASSET_DIRECTORY `
                      -PathType Container
              )
          ) {
              throw (
                  "Release asset directory was not created: " +
                  $env:RELEASE_ASSET_DIRECTORY
              )
          }

      # ---------------------------------------------------------------
      # Validate archive output
      # ---------------------------------------------------------------
      - name: Validate consolidated release archives
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path $env:RELEASE_MANIFEST -PathType Leaf)) {
              throw "Release manifest was not generated."
          }

          if (-not (Test-Path $env:RELEASE_CHECKSUMS -PathType Leaf)) {
              throw "SHA256SUMS.txt was not generated."
          }

          $manifest = Get-Content `
              -Path $env:RELEASE_MANIFEST `
              -Raw |
              ConvertFrom-Json

          $assets = @($manifest.assets)

          if ($assets.Count -eq 0) {
              throw "The release manifest contains no data archives."
          }

          $maximumParts = [int]$env:MAXIMUM_DATA_ARCHIVE_COUNT

          if ($assets.Count -gt $maximumParts) {
              throw @"
          Too many consolidated archives were generated: $($assets.Count)

          Maximum allowed by this workflow: $maximumParts

          The archive builder may be creating one release ZIP for each
          daily source archive instead of consolidating extracted CSV files.
          "@
          }

          $nseAssets = @(
              $assets |
              Where-Object {
                  $_.dataset -eq "NSE-Minute"
              }
          )

          $indexAssets = @(
              $assets |
              Where-Object {
                  $_.dataset -eq "NSE-Index-Minute"
              }
          )

          if ($nseAssets.Count -eq 0) {
              throw "No consolidated NSE stock archives were generated."
          }

          if ($indexAssets.Count -eq 0) {
              throw "No consolidated NSE index archives were generated."
          }

          $maximumBytes = [long]$env:MAXIMUM_ARCHIVE_BYTES

          foreach ($asset in $assets) {
              $assetPath = Join-Path `
                  $env:RELEASE_ASSET_DIRECTORY `
                  $asset.file

              if (-not (Test-Path $assetPath -PathType Leaf)) {
                  throw "Manifest asset does not exist: $assetPath"
              }

              $file = Get-Item $assetPath

              if ($file.Length -le 0) {
                  throw "Generated archive is empty: $($file.Name)"
              }

              if ($file.Length -ge $maximumBytes) {
                  throw (
                      "Generated archive exceeds the configured limit: " +
                      "$($file.Name) ($($file.Length) bytes)"
                  )
              }

              if (
                  [string]::IsNullOrWhiteSpace(
                      [string]$asset.sha256
                  )
              ) {
                  throw (
                      "Manifest checksum is missing for: " +
                      $asset.file
                  )
              }
          }

          "NSE_PART_COUNT=$($nseAssets.Count)" >> $env:GITHUB_ENV
          "INDEX_PART_COUNT=$($indexAssets.Count)" >> $env:GITHUB_ENV
          "RELEASE_DATA_ASSET_COUNT=$($assets.Count)" >> $env:GITHUB_ENV

          Write-Host "Archive validation passed."
          Write-Host "NSE stock parts: $($nseAssets.Count)"
          Write-Host "NSE index parts: $($indexAssets.Count)"
          Write-Host "Total data archives: $($assets.Count)"

      # ---------------------------------------------------------------
      # Prepare license asset
      # ---------------------------------------------------------------
      - name: Prepare license asset
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $licenseCandidates = @(
              "LICENSE",
              "LICENSE.txt",
              "LICENSE.md"
          )

          $sourceLicense = $licenseCandidates |
              ForEach-Object {
                  Join-Path `
                      $env:GITHUB_WORKSPACE `
                      $_
              } |
              Where-Object {
                  Test-Path $_ -PathType Leaf
              } |
              Select-Object -First 1

          if (-not $sourceLicense) {
              throw @"
          No repository license file was found.

          Add one of:
          - LICENSE
          - LICENSE.txt
          - LICENSE.md
          "@
          }

          $licensePath = Join-Path `
              $env:RELEASE_ASSET_DIRECTORY `
              "LICENSE"

          Copy-Item `
              -Path $sourceLicense `
              -Destination $licensePath `
              -Force

          if (-not (Test-Path $licensePath -PathType Leaf)) {
              throw "Failed to prepare the release license."
          }

          $license = Get-Item $licensePath

          if ($license.Length -le 0) {
              throw "Prepared release license is empty."
          }

          "RELEASE_LICENSE=$licensePath" >> $env:GITHUB_ENV

          Write-Host "License asset: $licensePath"

      # ---------------------------------------------------------------
      # Generate versioned release notes
      # ---------------------------------------------------------------
      - name: Generate versioned release notes
        shell: pwsh
        env:
          TARGET_COMMIT: ${{ github.sha }}
          INPUT_RELEASE_TITLE: ${{ inputs.release_title }}
        run: |
          $ErrorActionPreference = "Stop"

          $manifest = Get-Content `
              -Path $env:RELEASE_MANIFEST `
              -Raw |
              ConvertFrom-Json

          $assetRows = @(
              foreach ($asset in $manifest.assets) {
                  $sizeGiB = [Math]::Round(
                      [double]$asset.bytes / 1GB,
                      3
                  )

                  "| ``$($asset.file)`` | $($asset.dataset) | " +
                  "$($asset.sourceArchiveCount) | $sizeGiB GiB |"
              }
          ) -join [Environment]::NewLine

          $nseParts = @(
              $manifest.assets |
              Where-Object {
                  $_.dataset -eq "NSE-Minute"
              }
          ).Count

          $indexParts = @(
              $manifest.assets |
              Where-Object {
                  $_.dataset -eq "NSE-Index-Minute"
              }
          ).Count

          $commit = $env:TARGET_COMMIT.Trim()

          if ([string]::IsNullOrWhiteSpace($commit)) {
              throw "Versioned release commit is empty."
          }

          $shortCommit = $commit.Substring(
              0,
              [Math]::Min(7, $commit.Length)
          )

          $utcNow = (Get-Date).ToUniversalTime()

          $releaseNotesName = (
              "RELEASE_NOTES-" +
              $env:RELEASE_VERSION +
              ".md"
          )

          $releaseNotesPath = Join-Path `
              $env:RELEASE_ASSET_DIRECTORY `
              $releaseNotesName

          $content = Get-Content `
              -Path $env:RELEASE_TEMPLATE `
              -Raw

          $replacements = [ordered]@{
              "{{VERSION}}"      = $env:RELEASE_VERSION
              "{{DATE}}"         = $utcNow.ToString("yyyy-MM-dd")
              "{{TIME}}"         = $utcNow.ToString("HH:mm:ss")
              "{{COMMIT}}"       = $commit
              "{{SHORT_COMMIT}}" = $shortCommit
              "{{NSE_PARTS}}"    = [string]$nseParts
              "{{INDEX_PARTS}}"  = [string]$indexParts
              "{{ASSET_COUNT}}"  = [string]$manifest.assets.Count
              "{{ASSET_TABLE}}"  = $assetRows
          }

          foreach ($placeholder in $replacements.Keys) {
              $content = $content.Replace(
                  $placeholder,
                  $replacements[$placeholder]
              )
          }

          Set-Content `
              -Path $releaseNotesPath `
              -Value $content `
              -Encoding utf8

          if (-not (Test-Path $releaseNotesPath -PathType Leaf)) {
              throw "Versioned release notes were not created."
          }

          $notesFile = Get-Item $releaseNotesPath

          if ($notesFile.Length -le 0) {
              throw "Generated versioned release notes are empty."
          }

          $remainingPlaceholders = Select-String `
              -Path $releaseNotesPath `
              -Pattern '\{\{[A-Z0-9_]+\}\}' `
              -AllMatches

          if ($remainingPlaceholders) {
              $unresolved = @(
                  $remainingPlaceholders.Matches.Value |
                  Sort-Object -Unique
              )

              throw (
                  "Unresolved release-note placeholders: " +
                  ($unresolved -join ", ")
              )
          }

          $requestedTitle = $env:INPUT_RELEASE_TITLE

          if ($null -eq $requestedTitle) {
              $requestedTitle = ""
          }

          $requestedTitle = $requestedTitle.Trim()

          if ([string]::IsNullOrWhiteSpace($requestedTitle)) {
              $releaseTitle = (
                  "NSE One-Minute OHLCV Data " +
                  $env:RELEASE_VERSION
              )
          }
          else {
              $releaseTitle = $requestedTitle
          }

          "RELEASE_NOTES=$releaseNotesPath" >> $env:GITHUB_ENV
          "RELEASE_NOTES_NAME=$releaseNotesName" >> $env:GITHUB_ENV
          "RELEASE_TITLE=$releaseTitle" >> $env:GITHUB_ENV

          Write-Host "Release notes: $releaseNotesPath"
          Write-Host "Release title: $releaseTitle"

      # ---------------------------------------------------------------
      # Build complete release asset list
      # ---------------------------------------------------------------
      - name: Find versioned release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $assets = @(
              Get-ChildItem `
                  -Path $env:RELEASE_ASSET_DIRECTORY `
                  -File |
              Where-Object {
                  $_.Extension -eq ".zip" -or
                  $_.Name -eq "RELEASE_MANIFEST.json" -or
                  $_.Name -eq "SHA256SUMS.txt" -or
                  $_.Name -eq $env:RELEASE_NOTES_NAME -or
                  $_.Name -eq "LICENSE"
              } |
              Sort-Object Name
          )

          if ($assets.Count -eq 0) {
              throw "No versioned release assets were found."
          }

          $zipAssets = @(
              $assets |
              Where-Object {
                  $_.Extension -eq ".zip"
              }
          )

          if ($zipAssets.Count -eq 0) {
              throw "No ZIP release archives were found."
          }

          $requiredNames = @(
              "RELEASE_MANIFEST.json",
              "SHA256SUMS.txt",
              $env:RELEASE_NOTES_NAME,
              "LICENSE"
          )

          $assetNames = @(
              $assets |
              ForEach-Object {
                  $_.Name
              }
          )

          foreach ($requiredName in $requiredNames) {
              if ($requiredName -notin $assetNames) {
                  throw "Required release asset is missing: $requiredName"
              }
          }

          $maximumBytes = [long]$env:MAXIMUM_ARCHIVE_BYTES

          foreach ($asset in $assets) {
              if ($asset.Length -le 0) {
                  throw "Release asset is empty: $($asset.Name)"
              }

              if (
                  $asset.Extension -eq ".zip" -and
                  $asset.Length -ge $maximumBytes
              ) {
                  throw (
                      "Release ZIP exceeds the configured limit: " +
                      "$($asset.Name)"
                  )
              }
          }

          $assetListPath = Join-Path `
              $env:RUNNER_TEMP `
              "versioned-release-assets.txt"

          $assets.FullName |
              Set-Content `
                  -Path $assetListPath `
                  -Encoding utf8

          "RELEASE_ASSET_LIST=$assetListPath" >> $env:GITHUB_ENV
          "RELEASE_TOTAL_ASSET_COUNT=$($assets.Count)" >> $env:GITHUB_ENV

          Write-Host "Versioned release assets selected: $($assets.Count)"

          foreach ($asset in $assets) {
              $sizeMiB = [Math]::Round(
                  $asset.Length / 1MB,
                  2
              )

              Write-Host " - $($asset.Name): $sizeMiB MiB"
          }

      # ---------------------------------------------------------------
      # Detect existing versioned release
      # ---------------------------------------------------------------
      - name: Detect existing versioned release
        id: release_state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $previousNativePreference = `
              $PSNativeCommandUseErrorActionPreference

          try {
              $PSNativeCommandUseErrorActionPreference = $false

              gh release view `
                  $env:RELEASE_VERSION `
                  --json tagName `
                  *> $null

              $releaseViewExitCode = $LASTEXITCODE
          }
          finally {
              $PSNativeCommandUseErrorActionPreference = `
                  $previousNativePreference
          }

          # GitHub Actions may use the final native exit code as the
          # PowerShell step's result. Clear the expected exit code from
          # a missing release before continuing.
          $global:LASTEXITCODE = 0

          switch ($releaseViewExitCode) {
              0 {
                  Write-Host (
                      "Versioned release already exists: " +
                      $env:RELEASE_VERSION
                  )

                  "exists=true" >> $env:GITHUB_OUTPUT
              }

              1 {
                  Write-Host (
                      "Versioned release does not exist: " +
                      $env:RELEASE_VERSION
                  )

                  "exists=false" >> $env:GITHUB_OUTPUT
              }

              4 {
                  throw (
                      "GitHub CLI authentication failed while checking " +
                      "release $env:RELEASE_VERSION."
                  )
              }

              default {
                  throw (
                      "Unable to check release existence. " +
                      "gh release view returned exit code " +
                      $releaseViewExitCode
                  )
              }
          }

          # Ensure this step exits successfully for both existing and
          # missing releases.
          $global:LASTEXITCODE = 0

      # ---------------------------------------------------------------
      # Create or force-move version tag
      #
      # Re-running v1.0.0 moves that tag to the current commit.
      # ---------------------------------------------------------------
      - name: Create or move version tag
        shell: pwsh
        env:
          TARGET_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"

          $target = $env:TARGET_COMMIT.Trim()

          if ([string]::IsNullOrWhiteSpace($target)) {
              throw "Versioned release target commit is empty."
          }

          git tag `
              --force `
              $env:RELEASE_VERSION `
              $target

          if ($LASTEXITCODE -ne 0) {
              throw "Creating or updating the version tag failed."
          }

          git push `
              origin `
              "refs/tags/$env:RELEASE_VERSION" `
              --force

          if ($LASTEXITCODE -ne 0) {
              throw "Pushing the version tag failed."
          }

          Write-Host (
              "Version tag " +
              $env:RELEASE_VERSION +
              " now points to " +
              $target
          )

      # ---------------------------------------------------------------
      # Create a new versioned release
      # ---------------------------------------------------------------
      - name: Create versioned release
        if: steps.release_state.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_MAKE_LATEST: ${{ inputs.make_latest }}
        run: |
          $ErrorActionPreference = "Stop"

          $assets = @(
              Get-Content `
                  -Path $env:RELEASE_ASSET_LIST |
              Where-Object {
                  -not [string]::IsNullOrWhiteSpace($_)
              }
          )

          if ($assets.Count -eq 0) {
              throw "The versioned release asset list is empty."
          }

          $arguments = @(
              "release",
              "create",
              $env:RELEASE_VERSION
          )

          $arguments += $assets

          $arguments += @(
              "--title",
              $env:RELEASE_TITLE,
              "--notes-file",
              $env:RELEASE_NOTES,
              "--verify-tag"
          )

          if ($env:INPUT_PRERELEASE -eq "true") {
              $arguments += "--prerelease"
          }

          if (
              $env:INPUT_MAKE_LATEST -eq "true" -and
              $env:INPUT_PRERELEASE -ne "true"
          ) {
              $arguments += "--latest"
          }
          else {
              $arguments += "--latest=false"
          }

          & gh @arguments

          if ($LASTEXITCODE -ne 0) {
              throw "Creating the versioned release failed."
          }

          Write-Host "Versioned release created."

      # ---------------------------------------------------------------
      # Update existing release metadata
      # ---------------------------------------------------------------
      - name: Update versioned release metadata
        if: steps.release_state.outputs.exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_MAKE_LATEST: ${{ inputs.make_latest }}
        run: |
          $ErrorActionPreference = "Stop"

          $arguments = @(
              "release",
              "edit",
              $env:RELEASE_VERSION,
              "--title",
              $env:RELEASE_TITLE,
              "--notes-file",
              $env:RELEASE_NOTES
          )

          if ($env:INPUT_PRERELEASE -eq "true") {
              $arguments += "--prerelease"
          }
          else {
              $arguments += "--prerelease=false"
          }

          if (
              $env:INPUT_MAKE_LATEST -eq "true" -and
              $env:INPUT_PRERELEASE -ne "true"
          ) {
              $arguments += "--latest"
          }
          else {
              $arguments += "--latest=false"
          }

          & gh @arguments

          if ($LASTEXITCODE -ne 0) {
              throw "Updating versioned release metadata failed."
          }

          Write-Host "Versioned release metadata updated."

      # ---------------------------------------------------------------
      # Delete old assets
      #
      # This removes obsolete part names when the number of archives
      # changes between repeated executions of the same version.
      # ---------------------------------------------------------------
      - name: Delete old versioned release assets
        if: steps.release_state.outputs.exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $releaseJson = gh release view `
              $env:RELEASE_VERSION `
              --json assets

          if ($LASTEXITCODE -ne 0) {
              throw "Reading existing versioned release assets failed."
          }

          $release = $releaseJson |
              ConvertFrom-Json

          foreach ($asset in @($release.assets)) {
              Write-Host "Deleting old asset: $($asset.name)"

              gh release delete-asset `
                  $env:RELEASE_VERSION `
                  $asset.name `
                  --yes

              if ($LASTEXITCODE -ne 0) {
                  throw (
                      "Deleting old versioned release asset failed: " +
                      $asset.name
                  )
              }
          }

      # ---------------------------------------------------------------
      # Upload replacement assets
      # ---------------------------------------------------------------
      - name: Upload replacement versioned release assets
        if: steps.release_state.outputs.exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $assets = @(
              Get-Content `
                  -Path $env:RELEASE_ASSET_LIST |
              Where-Object {
                  -not [string]::IsNullOrWhiteSpace($_)
              }
          )

          if ($assets.Count -eq 0) {
              throw "The replacement versioned asset list is empty."
          }

          $arguments = @(
              "release",
              "upload",
              $env:RELEASE_VERSION
          )

          $arguments += $assets

          & gh @arguments

          if ($LASTEXITCODE -ne 0) {
              throw "Uploading replacement versioned release assets failed."
          }

          Write-Host "Replacement versioned release assets uploaded."

      # ---------------------------------------------------------------
      # Verify release and assets
      # ---------------------------------------------------------------
      - name: Verify versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $expectedAssets = @(
              Get-Content `
                  -Path $env:RELEASE_ASSET_LIST |
              Where-Object {
                  -not [string]::IsNullOrWhiteSpace($_)
              } |
              ForEach-Object {
                  Split-Path $_ -Leaf
              }
          )

          $releaseJson = gh release view `
              $env:RELEASE_VERSION `
              --json `
              tagName,name,isDraft,isPrerelease,assets,url

          if ($LASTEXITCODE -ne 0) {
              throw "Reading the versioned release failed."
          }

          $release = $releaseJson |
              ConvertFrom-Json

          $publishedAssets = @(
              $release.assets |
              ForEach-Object {
                  $_.name
              }
          )

          foreach ($expectedAsset in $expectedAssets) {
              if ($expectedAsset -notin $publishedAssets) {
                  throw (
                      "Expected versioned release asset is missing: " +
                      $expectedAsset
                  )
              }
          }

          $unexpectedAssets = @(
              $publishedAssets |
              Where-Object {
                  $_ -notin $expectedAssets
              }
          )

          if ($unexpectedAssets.Count -gt 0) {
              throw (
                  "Unexpected old versioned release assets remain: " +
                  ($unexpectedAssets -join ", ")
              )
          }

          "RELEASE_URL=$($release.url)" >> $env:GITHUB_ENV

          Write-Host "Versioned release verification passed."
          Write-Host "Release URL: $($release.url)"

      # ---------------------------------------------------------------
      # Workflow summary
      # ---------------------------------------------------------------
      - name: Write workflow summary
        if: success()
        shell: pwsh
        run: |
          if (
              "${{ steps.release_state.outputs.exists }}" -eq
              "true"
          ) {
              $operation = "Overwrote existing versioned release"
          }
          else {
              $operation = "Created versioned release"
          }

          @"
          ## NSE Minute Versioned Release

          - **Operation:** $operation
          - **Version:** ``$env:RELEASE_VERSION``
          - **Title:** $env:RELEASE_TITLE
          - **NSE archive parts:** $env:NSE_PART_COUNT
          - **Index archive parts:** $env:INDEX_PART_COUNT
          - **Data archives:** $env:RELEASE_DATA_ASSET_COUNT
          - **Total release assets:** $env:RELEASE_TOTAL_ASSET_COUNT
          - **Commit:** ``${{ github.sha }}``
          - **Pre-release:** ${{ inputs.prerelease }}
          - **Latest release:** ${{ inputs.make_latest }}
          - **Release:** $env:RELEASE_URL
          "@ >> $env:GITHUB_STEP_SUMMARY